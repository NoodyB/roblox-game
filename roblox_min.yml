---
# Minimal Roblox standard library for selene (the full `roblox` std needs a network fetch that
# isn't available in the cloud build environment). Globals are declared permissively (`any`);
# selene still catches undefined globals, unused variables, shadowing, etc.
base: luau
name: roblox_min
globals:
  game: { any: true }
  workspace: { any: true }
  script: { any: true }
  plugin: { any: true }
  shared: { any: true }
  Instance: { any: true }
  Vector3: { any: true }
  Vector2: { any: true }
  Vector3int16: { any: true }
  CFrame: { any: true }
  Color3: { any: true }
  BrickColor: { any: true }
  UDim: { any: true }
  UDim2: { any: true }
  Rect: { any: true }
  Enum: { any: true }
  Ray: { any: true }
  Region3: { any: true }
  Random: { any: true }
  TweenInfo: { any: true }
  NumberSequence: { any: true }
  NumberSequenceKeypoint: { any: true }
  ColorSequence: { any: true }
  ColorSequenceKeypoint: { any: true }
  NumberRange: { any: true }
  PhysicalProperties: { any: true }
  Font: { any: true }
  DateTime: { any: true }
  task: { any: true }
  typeof: { any: true }
  warn: { any: true }
  tick: { any: true }
  time: { any: true }
  elapsedTime: { any: true }
  settings: { any: true }
  UserSettings: { any: true }
