<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sweep Squad promo art</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #222; }
  .asset { position: relative; overflow: hidden; margin: 0 0 40px 0; font-family: "Fredoka", "Arial Rounded MT Bold", "DejaVu Sans", sans-serif; }
  #icon { width: 512px; height: 512px; }
  .thumb { width: 1920px; height: 1080px; }
  .title {
    position: absolute; left: 0; right: 0; text-align: center; color: #fff; font-weight: 700;
    -webkit-text-stroke: 14px #4a2e1f; paint-order: stroke fill; letter-spacing: 2px;
    text-shadow: 0 10px 0 rgba(74,46,31,0.55);
  }
</style>
</head>
<body>

<!-- ============================ ICON 512x512 ============================ -->
<div id="icon" class="asset">
<svg width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ibg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="55%" stop-color="#ff9a3d"/>
      <stop offset="100%" stop-color="#d9531e"/>
    </radialGradient>
    <linearGradient id="vac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fe0b0"/>
      <stop offset="100%" stop-color="#2fae7a"/>
    </linearGradient>
    <g id="leaf">
      <path d="M0,-22 C14,-14 16,6 0,22 C-16,6 -14,-14 0,-22 Z"/>
      <path d="M0,-18 L0,20" stroke="#7a3b12" stroke-width="2.5" fill="none" opacity="0.6"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#ibg)"/>
  <!-- swirl -->
  <g fill="none" stroke="#fff" stroke-linecap="round" opacity="0.55">
    <path d="M90,150 C170,60 300,70 330,170" stroke-width="16"/>
    <path d="M70,240 C140,170 240,180 300,230" stroke-width="12"/>
  </g>
  <!-- leaves -->
  <g stroke="#4a2e1f" stroke-width="4">
    <use href="#leaf" transform="translate(96,140) rotate(-30) scale(1.4)" fill="#e8502c"/>
    <use href="#leaf" transform="translate(170,92) rotate(20) scale(1.2)" fill="#ffc23a"/>
    <use href="#leaf" transform="translate(250,86) rotate(60) scale(1.1)" fill="#f07a2a"/>
    <use href="#leaf" transform="translate(120,232) rotate(-70) scale(1.3)" fill="#f7b035"/>
    <use href="#leaf" transform="translate(205,200) rotate(35) scale(1.0)" fill="#d8402a"/>
    <use href="#leaf" transform="translate(64,320) rotate(-10) scale(1.15)" fill="#e8502c"/>
  </g>
  <!-- vacuum -->
  <g stroke="#4a2e1f" stroke-width="8" stroke-linejoin="round">
    <rect x="300" y="170" width="120" height="150" rx="46" fill="url(#vac)"/>
    <circle cx="360" cy="245" r="30" fill="#fff"/>
    <circle cx="360" cy="245" r="14" fill="#ffc83d"/>
    <path d="M320,300 L250,360 L205,318" fill="none" stroke-width="30" stroke="#4a2e1f"/>
    <path d="M320,300 L250,360 L205,318" fill="none" stroke-width="16" stroke="#8b5cf6"/>
    <rect x="150" y="286" width="80" height="54" rx="14" transform="rotate(-40 190 313)" fill="#3a3a48"/>
    <rect x="344" y="120" width="24" height="60" rx="10" fill="#3a3a48"/>
  </g>
  <!-- logo -->
  <text x="256" y="452" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="84"
        fill="#fff" stroke="#4a2e1f" stroke-width="16" paint-order="stroke" letter-spacing="2">SWEEP</text>
  <text x="256" y="500" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="46"
        fill="#ffe28a" stroke="#4a2e1f" stroke-width="12" paint-order="stroke" letter-spacing="6">SQUAD</text>
</svg>
</div>

  <g stroke="#4a2e1f" stroke-width="3">
    <use href="#lf" transform="translate(760,760) rotate(20) scale(1.2)" fill="#f5b03c"/>

    <use href="#lf" transform="translate(1290,860) rotate(80) scale(1.0)" fill="#d8472c"/>
  </g>
  <!-- kids -->
  <use href="#kid" transform="translate(560,640) scale(1.5)"/>
  <use href="#kid" transform="translate(1050,760) scale(1.6)"/>
  <use href="#kid" transform="translate(1420,620) scale(1.3) translate(0,0)"/>
  <!-- coin burst -->
  <g stroke="#4a2e1f" stroke-width="5" fill="#ffc83d">
    <circle cx="1560" cy="470" r="26"/><circle cx="1620" cy="420" r="20"/><circle cx="1500" cy="420" r="18"/>
    <circle cx="1660" cy="490" r="16"/><circle cx="1470" cy="490" r="14"/>
  </g>
  <text x="1565" y="480" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="28" fill="#4a2e1f">$</text>
</svg>
<div class="title" style="top: 40px; font-size: 150px;">CLEAN EVERYTHING!</div>
<div class="title" style="bottom: 30px; left: 40px; right: auto; font-size: 64px; color:#ffe28a;">SWEEP SQUAD</div>
</div>
