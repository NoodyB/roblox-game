<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sweep Squad store icons</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #222; }
  #stage { width: 512px; height: 512px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// 512x512 icons for game passes and developer products. Roblox shows game pass icons cropped to a
// circle, so all art and text stays inside the central circle (radius ~230).
const INK = "#4a2e1f";
const FONT = "Fredoka, 'Arial Rounded MT Bold', sans-serif";

function rays(color = "#fff", opacity = 0.13) {
  let d = "";
  for (let i = 0; i < 18; i++) {
    const a0 = (i / 18) * Math.PI * 2, a1 = a0 + Math.PI / 18;
    d += `M256,256 L${256 + 400 * Math.cos(a0)},${256 + 400 * Math.sin(a0)} L${256 + 400 * Math.cos(a1)},${256 + 400 * Math.sin(a1)} Z `;
  }
  return `<path d="${d}" fill="${color}" opacity="${opacity}"/>`;
}

function sparkle(x, y, s, color = "#fff") {
  return `<path transform="translate(${x},${y}) scale(${s})" d="M0,-20 C3,-5 5,-3 20,0 C5,3 3,5 0,20 C-3,5 -5,3 -20,0 C-5,-3 -3,-5 0,-20 Z" fill="${color}"/>`;
}

// gold coin with a thickness edge and a leaf emblem
function coin(x, y, r, rot = 0, face = "") {
  const inner = face
    ? `<text x="0" y="${r * 0.3}" text-anchor="middle" font-family="${FONT}" font-weight="700" font-size="${r * 0.9}" fill="#b86a10">${face}</text>`
    : `<path d="M0,${-r * 0.45} C${r * 0.3},${-r * 0.28} ${r * 0.32},${r * 0.14} 0,${r * 0.45} C${-r * 0.32},${r * 0.14} ${-r * 0.3},${-r * 0.28} 0,${-r * 0.45} Z" fill="#e59a1a"/>
       <path d="M0,${-r * 0.36} L0,${r * 0.4}" stroke="#ffe28a" stroke-width="${r * 0.06}" stroke-linecap="round"/>`;
  return `<g transform="translate(${x},${y}) rotate(${rot})" stroke-linejoin="round">
    <circle cx="0" cy="${r * 0.12}" r="${r}" fill="#d98a14" stroke="${INK}" stroke-width="${Math.max(5, r * 0.09)}"/>
    <circle cx="0" cy="0" r="${r}" fill="#ffc83d" stroke="${INK}" stroke-width="${Math.max(5, r * 0.09)}"/>
    <circle cx="0" cy="0" r="${r * 0.74}" fill="none" stroke="#e59a1a" stroke-width="${r * 0.07}"/>
    ${inner}
    <path d="M${-r * 0.55},${-r * 0.5} A${r * 0.75},${r * 0.75} 0 0 1 ${-r * 0.1},${-r * 0.78}" stroke="#fff6cf" stroke-width="${r * 0.1}" stroke-linecap="round" fill="none"/>
  </g>`;
}

function label(text, size = 96, color = "#fff", y = 452) {
  return `<text x="256" y="${y}" text-anchor="middle" font-family="${FONT}" font-weight="700" font-size="${size}"
    fill="${color}" stroke="${INK}" stroke-width="${size * 0.17}" paint-order="stroke" letter-spacing="2">${text}</text>`;
}

function pill(text, fill = "#ffffff", textColor = INK, y = 418, size = 50) {
  const w = text.length * size * 0.62 + 56;
  return `<g>
    <rect x="${256 - w / 2}" y="${y}" width="${w}" height="${size + 28}" rx="${(size + 28) / 2}" fill="${fill}" stroke="${INK}" stroke-width="9"/>
    <text x="256" y="${y + size + 4}" text-anchor="middle" font-family="${FONT}" font-weight="700" font-size="${size}" fill="${textColor}">${text}</text>
  </g>`;
}

function frame(c1, c2, body) {
  return `<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bg" cx="50%" cy="42%" r="72%">
        <stop offset="0%" stop-color="${c1}"/>
        <stop offset="100%" stop-color="${c2}"/>
      </radialGradient>
      <radialGradient id="glow" cx="50%" cy="45%" r="50%">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="512" height="512" fill="url(#bg)"/>
    ${rays()}
    <circle cx="256" cy="220" r="200" fill="url(#glow)"/>
    ${body}
  </svg>`;
}

  product_coin_crate: () => frame("#b3dcff", "#1f5fb8", `

      <ellipse cx="262" cy="226" rx="92" ry="28" fill="#b3e4ff"/>

      <path transform="translate(392,176) rotate(40)" d="M0,-24 C16,-14 18,6 0,24 C-18,6 -16,-14 0,-24 Z" fill="#ffc23a"/>
      <path transform="translate(360,286) rotate(-60)" d="M0,-20 C13,-12 15,5 0,20 C-15,5 -13,-12 0,-20 Z" fill="#e8502c"/>

    ${coin(160, 300, 34, -20)} ${coin(360, 296, 38, 15)} ${coin(206, 360, 28, 10)} ${coin(318, 356, 26, -10)}

};

window.iconNames = Object.keys(ICONS);
window.showIcon = (name) => { document.getElementById("stage").innerHTML = ICONS[name](); };
window.ready = true;
</script>
</body>
</html>
